name: BlockRacing
version: 26.3.0
main: top.lqsnow.blockracing.Main
api-version: '26.3'
authors: [ LQ_Snow, xiaojiuwo233, FHSHKL ]
description: The first team to collect the required blocks wins
permissions:
  blockracing.update-notify:
    description: Receive notifications about newer official BlockRacing releases.
    default: op
  blockracing.user:
    default: true
  blockracing.admin:
    default: op
    children:
      blockracing.user: true
commands:
  tp:
    usage: "/tp <Teammate>"
    description: "TP to teammate."
  locatestructure:
    usage: "/locate <Structure>"
    description: "Locate structure."
  locatebiome:
    usage: "/locate <Biome>"
    description: "Locate biome."
  bradmin:
    usage: "/bradmin <start|stop>"
    description: "Admin operations on arenas."
    permission: blockracing.admin
  debug:
    usage: "/debug"
    description: "Debug."
    permission: op
  menu:
    usage: "/menu"
    description: "Open the menu."
  arena:
    usage: "/arena <join|leave|list> [id]"
    description: "Join or leave a game."
  waypoint:
    usage: "/waypoint"
    description: "Run waypoint commands."
  block:
    usage: "/block <team> <number>"
    description: "Query block."
    permission: blockracing.admin
  randomteam:
    usage: "/randomteam [confirm]"
    description: "Request or confirm balanced random teams."
  shout:
    aliases: [all]
    usage: "/shout <message>"
    description: "Send a message to every player."
  language:
    aliases: [lang]
    usage: "/language [auto|zh_cn|en_us]"
    description: "Select your display language."
