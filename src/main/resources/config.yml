# BlockRacing game settings
# This file preserves the current game settings across server restarts.
# Settings are saved automatically when the server stops.
# While the server is running, change these options through the in-game menu.
# Player languages are selected independently with /language and are not configured here.

# Optional block pools in addition to the required easy pool
medium-block: false
hard-block: false
dyed-block: false
end-block: false

# Total number of target blocks in one game
block-amount: 50

# Game mode:
# normal - Teams receive different random target lists. Collecting a block gives
#          a stack of that block to the opposing team's chests.
# racing - Teams receive the same targets in the same order. No blocks are
#          awarded to the opposing team.
game-mode: normal

# Speed mode:
# Gives players additional starting items and effects. Each collected block is
# worth 3 points instead of 1.
# Items: Silk Touch iron pickaxe, cooked beef, damaged elytra and Mending book
# Effect: Haste V
speed-mode: false

# Number of shared chests per team (default: 8, maximum: 53)
max-team-chest-num: 8

# Number of waypoints per team (default: 8, maximum: 53)
max-team-waypoint-num: 8

# Maximum number of target rerolls available to each team per game
# This is an administrator setting and is not exposed in the preparation menu.
max-roll-count: 3

# Whether to restore an unfinished game after a server restart.
# Disabled by default: finished games recycle automatically and public servers
# should not resume old rounds.
recovery:
  enabled: false

# World settings for per-game arenas.
# world-prefix - each game runs in its own world named "<world-prefix><id>".
# backup-keep  - how many recycled arena worlds to keep in world-backups/.
# min-players / max-players - join limits per game.
# auto-start - start automatically once everyone is ready and min-players met.
# idle-rooms - number of empty waiting rooms kept available.
# max-game-minutes - watchdog limit before a running game is force-ended.
# countdown-seconds - auto-start countdown once everyone is ready; 0 disables
#                     the countdown and starts immediately.
arena:
  world-prefix: "arena_"
  backup-keep: 8
  min-players: 2
  max-players: 8
  auto-start: true
  idle-rooms: 1
  max-game-minutes: 240
  countdown-seconds: 10

# Lobby world players wait in between games (created if missing).
lobby:
  world: "lobby"

# Internal compatibility value. Do not edit this manually.
config-version: 26.2.1
