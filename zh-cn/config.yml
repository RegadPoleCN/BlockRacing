# BlockRacing 游戏设置
# 该配置文件仅用于服务器重启后保留设置数据
# 服务器关闭时将自动保存本局游戏的设置到该文件
# 如果服务器已启动，请前往游戏中的设置界面进行设置，不要在这里调整
# 每位玩家可使用 /language 独立选择语言，此文件不控制玩家语言

# 旧选项仅保留用于恢复旧版进行中对局
# 标准难度：casual / easy / normal / hard / nightmare；铜附属方块默认关闭
difficulty: normal
copper-extras: false

medium-block: false
hard-block: false
dyed-block: false
end-block: false

# 一局游戏需要收集的方块总数
block-amount: 50

# 游戏模式：
# normal - 普通模式：两个队伍需要收集的方块及顺序完全随机，收集方块会将一组该方块给到对方的队伍箱子里
# racing - 竞速模式：两个队伍需要收集的方块及顺序将完全相同，且收集方块将不会给予一组方块到对方队伍箱子里
game-mode: normal

# 极速模式：
# 开启后给予额外道具和效果；简单/中等/困难/噩梦分别获得3/4/5/6分（普通为1/2/3/4分）
# 物品：精准采集铁镐、熟牛排、损坏的鞘翅、经验修补附魔书
# 效果：急迫V
speed-mode: false

# 团队箱子个数
# 默认：8
# 最大：53
max-team-chest-num: 8

# 路径点个数
# 默认：8
# 最大：53
max-team-waypoint-num: 8

# 每支队伍每局最多可轮换目标方块的次数
# 该项仅供服务器管理员修改，不会出现在准备菜单中
max-roll-count: 3

# 服务器重启后是否恢复上一局未完成的游戏进度
# 默认关闭：游戏结束后世界会自动回收，公开服务器不建议开启
recovery:
  enabled: false

# 每局游戏的独立世界设置
# world-prefix - 每局游戏在名为“<world-prefix><编号>”的独立世界中运行
# backup-keep  - world-backups/ 目录中保留的已回收世界备份数量
# min-players / max-players - 每局游戏的加入人数下限/上限
# auto-start - 所有人准备且达到最少人数后自动开局
# idle-rooms - 保持可用的空等待房间数量
# max-game-minutes - 看门狗强制结束一局的最长时间（分钟）
# countdown-seconds - 全员准备后的开局倒计时秒数；0 = 关闭倒计时立即开局
arena:
  world-prefix: "arena_"
  backup-keep: 8
  min-players: 2
  max-players: 8
  auto-start: true
  idle-rooms: 1
  max-game-minutes: 240
  countdown-seconds: 10

# 玩家在对局之间等待所在的大厅世界（不存在时自动创建）
lobby:
  world: "lobby"

# 内部兼容版本，请勿手动修改
config-version: 26.3.0

# Check GitHub stable releases at startup and every 6 hours; only notify about newer versions.
# Connection failures and up-to-date results are silent. No automatic downloads.
check-updates: true
